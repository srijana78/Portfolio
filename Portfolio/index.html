 <!-- class="font-['Inter',sans-serif] = This is Tailwind utility class combination Why do we include sans-serif?
If for some reason a user's browser fails to load the Inter font (e.g., they have a bad internet connection, or they are offline), the browser needs to know what type of backup font to use.

sans-serif tells the browser: "If you can't find Inter, pick any clean, modern sans-serif font available on the user's computer" (like Arial, Helvetica, or system default sans-serif). -->
<body class="font-['Inter',sans-serif] bg-slate-900 text-slate-100">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
